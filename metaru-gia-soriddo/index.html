<!DOCTYPE html>
<html lang="en">
  <head>
    <title>MGS V Counter</title>
    <link rel="shortcut icon" href="./img/otacon.png">
    <link href='https://fonts.googleapis.com/css?family=Droid+Sans' rel='stylesheet' type='text/css'>
  </head>
  <body>
    <p style="font-family: 'Droid Sans', sans-serif;font-size: 60px; margin: 80px 0 10px 0; text-align: center">
      Number of days for which I have not played
      <br>
      <span style="color: red">Metal Gear Solid V</span>
    </p>
    <p id="day-display" style="font-family: 'Droid Sans', sans-serif;font-size: 300px; margin: 10px; text-align: center">0</p>
    <img style="position: absolute; left: 0; right: 0; margin: 0 auto" src="./img/mgs2-box.png">
  </body>
  <script>
    var date1 = new Date("09/01/2015");
    var date2 = new Date();
    var timeDiff = Math.abs(date2.getTime() - date1.getTime());
    var diffDays = Math.ceil(timeDiff / (1000 * 3600 * 24));
    document.getElementById("day-display").innerText = diffDays;
  </script>
</html>
