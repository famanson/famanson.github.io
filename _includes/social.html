<!-- WARNING: Won't work locally -->

<div class="social">
    <div class="tweet"><a href="https://twitter.com/share"
    	class="twitter-share-button"
        data-url="{{ site.url }}{{ page.url }}">Tweet</a>
    </div>
    <div
        class="fb-like" 
        data-href="{{ site.url }}{{ page.url }}"
        data-layout="button_count" data-action="like"
        data-show-faces="true" data-share="true">
    </div>
    <!-- <div class="g-plusone" data-size="medium"></div> -->
</div>

<!-- Facebook Javascript SDK -->
<div id="fb-root"></div>
<script>
(function(d, s, id) {
var js, fjs = d.getElementsByTagName(s)[0];
if (d.getElementById(id)) return;
js = d.createElement(s); js.id = id;
js.src = "//connect.facebook.net/en_GB/all.js#xfbml=1&appId={{ site.facebook.appId }}";
fjs.parentNode.insertBefore(js, fjs);
}(document, 'script', 'facebook-jssdk'));</script>

<!-- Twitter -->
<script>!function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src="https://platform.twitter.com/widgets.js";fjs.parentNode.insertBefore(js,fjs);}}(document,"script","twitter-wjs");</script>
