<!DOCTYPE html>
<html lang="en" ng-app="Pravo">
    <head>
        <meta http-equiv="content-type" content="text/html; charset=UTF-8">
        <meta charset="utf-8">
        <title>Welcome to Pravo!</title>
        <meta name="generator" content="Bootply" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
        <link href="css/bootstrap.min.css" rel="stylesheet">
        <!-- Custom styles for this template -->
        <link href="./css/font-awesome.min.css" rel="stylesheet">
        <link href="./css/main.min.css" rel="stylesheet">
        <link href="./css/switchery.css" rel="stylesheet">
        <link rel="stylesheet" type="text/css" href="css/creative-buttons.css" />
        <!-- Libraries/dependencies -->
        <script src="./lib/jquery.min.js"></script>
        <script src="./lib/bootstrap.min.js"></script>
        <script src="./lib/angular.js"></script>
        <script src="./lib/angular-sanitize.js"></script>
        <script src="./lib/switchery.js"></script>
        <script src="./lib/ng-switchery.js"></script>
        <script src="./lib/holder.js"></script>
        <!-- Our own js files -->
        <script src="./js/data.js"></script>
        <script src="./js/controllers.js"></script>
        <script src="./js/directives.js"></script>
        <script src="./js/filters.js"></script>
        <script src="./js/main.js"></script>
    </head>
    <body>
        <div class="navbar navbar-custom navbar-fixed-top">
            <div class="col-xs-4">
                <div class="navbar-header">
                    <a class="navbar-brand" href="#">PRAVO</a>
                </div>
            </div>
            <div class="col-xs-8">
                <div class="navbar-collapse collapse">
                    <ul class="nav navbar-nav">
                        <li class="active"><a href="#">Home</a></li>
                        <li><a href="#">Messages (5)</a></li>
                        <li><a href="#">Starred</a></li>
                        <li>&nbsp;</li>
                    </ul>
                    <form class="navbar-form">
                        <div class="form-group" style="display:inline;">
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div id="map-canvas"></div>
        <div class="container-fluid" id="main">
            <div class="row">
                <div class="col-xs-4"><!--map-canvas will be postioned here--></div>
                <div class="col-xs-2 filter-column-wrapper">
                    <div class="filter-column">
                        <div class="main-search text-input">
                            <input type="text" placeholder="Street, district name..."/>
                            <i class="glyphicon glyphicon-search"></i>
                        </div>
                        <ul class="filters">
                            <li>
                                <div class="col-xs-1"></div>
                                <div class="option enabled col-xs-5">Rent</div>
                                <div class="option col-xs-5">Sale</div>
                                <div class="col-xs-1"></div>
                                <div class="clear"/>
                            </li>
                            <li>
                                <div class="text-label">Max price:</div>
                                <div class="text-input"><input type="text" placeholder="VND" maxlength="12"/></div>
                                <div class="clear"/>
                            </li>
                            <li>
                                <div class="text-label">Min price:</div>
                                <div class="text-input"><input type="text" placeholder="VND" maxlength="12" /></div>
                                <div class="clear"/>
                            </li>
                            <li>
                                <div class="text-label">Bedrooms:</div>
                                <div class="clear"/>
                            </li>
                            <li>
                                <div class="text-label toggle-optional-filters">Show optional filters <b>&gt;&gt;</b></div>
                                <div class="clear"/>
                            </li>
                            <li class="optional">
                                <div class="switch-label">Pets allowed:</div>
                                <div class="switch-input"><input type="checkbox" class="js-switch" unchecked /></div>
                                <div class="clear"/>
                            </li>
                            <li class="optional">
                                <div class="switch-label">School nearby</div>
                                <div class="switch-input"><input type="checkbox" class="js-switch" unchecked /></div>
                                <div class="clear"/>
                            </li>
                        </ul>
                    </div>
                </div>
                <div ng-controller="ListingCtrl" class="listing-column col-xs-6 listing-column-wrapper">
                    <ul>
                        <li ng-repeat="listing in listings" ng-style="{'width': postWidthPx}" class="post">
                            <img class="preview img-responsive holder" data-src="holder.js/{{ postWidth }}x{{ postWidth }}">
                            <div class="text-preview">
                                <div class="price">VND <b>{{ listing.price }}</b></div>
                                <div class="bedrooms">2 bedrooms</div>
                            </div>
                            <div style='clear: both'></div>
                        </li>
                    </ul>
                    <div class="page-counter-wrapper">
                        <button class="btn btn-4 btn-4d icon-arrow-left" ng-click="prevPage()">Prev</button>
                        <span class="page-counter">{{ currentPage }} / 10</span>
                        <button class="btn btn-4 btn-4c icon-arrow-right" ng-click="nextPage()">Next</button>
                    </div>
                </div>
          </div>
        </div>

    <!-- script references -->
        <script src="http://maps.googleapis.com/maps/api/js?sensor=false&extension=.js&output=embed"></script>
        <script src="js/scripts.js"></script>
    </body>
</html>
